[package]
name = "vtf2png-app"
version = "0.1.0"
description = "VTF to PNG batch converter"
edition = "2021"
rust-version = "1.77"

[lib]
name = "vtf2png_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# VTF/PNG pipeline
texture2ddecoder = "0.1"   # pure-Rust DXT1/3/5 decoder (MIT/Apache)
png = "0.17"               # PNG encoder (replaces libpng, pure Rust)
walkdir = "2.5"            # find .vtf files in a folder
thiserror = "2"            # ergonomic enum error types
base64 = "0.22"            # encode preview PNGs for the frontend

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
